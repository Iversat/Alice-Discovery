[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-discovery-research"
version = "0.2.0"
description = "Local mDNS discovery for smart speakers; independent research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zeroconf>=0.148,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
alice-discovery = "multiroom_scanner:main"

[tool.setuptools]
py-modules = ["multiroom_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
